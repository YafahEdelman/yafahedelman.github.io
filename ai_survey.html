<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Usage Survey - Yafah Edelman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .grid-table { width: 100%; border-collapse: collapse; }
        .grid-table th, .grid-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #e5e7eb; font-size: 0.85rem; }
        .grid-table th { background: #f9fafb; font-weight: 600; position: sticky; top: 0; }
        .grid-table td:first-child { text-align: left; font-weight: 500; min-width: 180px; }
        .grid-table tr:hover { background: #f0f4ff; }
        .option-label { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 2px solid #e5e7eb; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
        .option-label:hover { border-color: #a5b4fc; background: #f0f4ff; }
        .option-label.selected { border-color: #6366f1; background: #eef2ff; }
        .option-label input[type="checkbox"], .option-label input[type="radio"] { accent-color: #6366f1; width: 18px; height: 18px; flex-shrink: 0; }
        .other-input { margin-left: 28px; margin-top: 4px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; width: calc(100% - 28px); font-size: 0.9rem; }
        .other-input:disabled { background: #f3f4f6; }
        .btn-primary { background: #4f46e5; color: white; padding: 12px 32px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; transition: background 0.15s; }
        .btn-primary:hover { background: #4338ca; }
        .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
        .btn-secondary { background: white; color: #374151; padding: 12px 32px; border-radius: 10px; font-weight: 600; border: 2px solid #e5e7eb; cursor: pointer; transition: all 0.15s; }
        .btn-secondary:hover { background: #f9fafb; border-color: #d1d5db; }
        .progress-fill { transition: width 0.4s ease; }
        @media (max-width: 640px) {
            .grid-table { font-size: 0.75rem; }
            .grid-table th, .grid-table td { padding: 6px 3px; }
            .grid-table td:first-child { min-width: 120px; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center py-8 px-4">

<div id="survey-app" class="w-full max-w-2xl">
    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">AI Usage Survey</h1>
        <p class="text-gray-500 text-sm mt-1">Your responses are stored locally and never sent to a server.</p>
    </div>

    <!-- Progress -->
    <div class="mb-6">
        <div class="flex justify-between text-xs text-gray-500 mb-1">
            <span id="progress-label">Question 1</span>
            <span id="progress-pct">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
            <div id="progress-bar" class="progress-fill bg-indigo-500 h-2 rounded-full" style="width:0%"></div>
        </div>
    </div>

    <!-- Question Area -->
    <div id="question-area" class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-8 min-h-[300px]">
    </div>

    <!-- Navigation -->
    <div class="flex justify-between mt-6">
        <button id="btn-back" class="btn-secondary" onclick="survey.back()" style="visibility:hidden">&larr; Back</button>
        <button id="btn-next" class="btn-primary" onclick="survey.next()">Next &rarr;</button>
    </div>

    <!-- Back to main -->
    <div class="text-center mt-8">
        <a href="index.html" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm">&larr; Back to Main Page</a>
    </div>
</div>

<script>
// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function el(id) { return document.getElementById(id); }
function qs(sel) { return document.querySelector(sel); }
function qsa(sel) { return document.querySelectorAll(sel); }

// ============================================================
// SURVEY ENGINE
// ============================================================
const survey = {
    responses: {},
    stepIndex: 0,
    _validationService: null, // which service Q2 is shown for

    // Compute the ordered list of step IDs based on current responses
    getSteps() {
        const steps = ['q1'];
        const q1 = this.responses.q1 || [];
        const validationMap = {
            'Google Gemini': 'q2a',
            'Microsoft Copilot/Microsoft 365 Copilot': 'q2b',
            'Meta AI': 'q2c',
            'Grok': 'q2d',
            'Perplexity': 'q2e'
        };
        const eligible = q1.filter(s => validationMap[s]);
        if (eligible.length > 0) {
            if (!this._validationService || !eligible.includes(this._validationService)) {
                this._validationService = shuffle(eligible)[0];
            }
            steps.push(validationMap[this._validationService]);
        }

        steps.push('q3');

        const q3 = this.responses.q3 || {};
        const hasSub = Object.values(q3).some(v => v === 'yes_self' || v === 'yes_employer');
        if (hasSub) {
            steps.push('q4');
            const q4 = this.responses.q4;
            if (q4 === 'Monthly') steps.push('q5a');
            else if (q4 === 'Annually') steps.push('q5b');
            steps.push('q6');
        }

        steps.push('employment');

        const usedAI = q1.length > 0 && !q1.every(s => s === 'I have not used an AI service over the past 7 days');
        if (usedAI) {
            steps.push('q7', 'q8');
            const emp = this.responses.employment;
            if (emp === 'employed') {
                steps.push('q9');
                const q9 = this.responses.q9;
                if (q9 === 'I used it mostly for work' || q9 === 'I used it roughly similarly between work and personal purposes') {
                    steps.push('q10');
                }
            }
            steps.push('q11', 'q12');
            if (emp === 'employed') {
                steps.push('q13', 'q14');
            }
            steps.push('q15');
        }

        steps.push('results');
        return steps;
    },

    getServiceLabel() {
        const q1 = (this.responses.q1 || []).filter(s => s !== 'I have not used an AI service over the past 7 days');
        const named = q1.filter(s => !s.startsWith('Other:'));
        if (named.length === 1) return named[0];
        return 'an AI service';
    },

    getSubscribedServices() {
        const q3 = this.responses.q3 || {};
        return Object.keys(q3).filter(k => q3[k] === 'yes_self' || q3[k] === 'yes_employer');
    },

    currentStepId() {
        return this.getSteps()[this.stepIndex];
    },

    render() {
        const steps = this.getSteps();
        const stepId = steps[this.stepIndex];
        const area = el('question-area');
        area.innerHTML = '';
        area.className = 'bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-8 min-h-[300px] fade-in';

        if (renderers[stepId]) {
            renderers[stepId](area);
        }

        // Progress
        const total = steps.length - 1; // exclude results
        const pct = stepId === 'results' ? 100 : Math.round((this.stepIndex / total) * 100);
        el('progress-bar').style.width = pct + '%';
        el('progress-pct').textContent = pct + '%';
        el('progress-label').textContent = stepId === 'results' ? 'Complete!' : `Step ${this.stepIndex + 1} of ${total}`;

        // Buttons
        el('btn-back').style.visibility = this.stepIndex > 0 && stepId !== 'results' ? 'visible' : 'hidden';
        el('btn-next').style.display = stepId === 'results' ? 'none' : '';
        el('btn-next').textContent = steps[this.stepIndex + 1] === 'results' ? 'Finish' : 'Next \u2192';
    },

    next() {
        const stepId = this.currentStepId();
        // Save current responses
        if (savers[stepId]) {
            const valid = savers[stepId]();
            if (!valid) return;
        }
        const steps = this.getSteps(); // recompute after save
        // Find current step in new list and advance
        const curIdx = steps.indexOf(stepId);
        if (curIdx >= 0 && curIdx < steps.length - 1) {
            this.stepIndex = curIdx + 1;
        } else {
            this.stepIndex = Math.min(this.stepIndex + 1, steps.length - 1);
        }
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    back() {
        if (this.stepIndex > 0) {
            this.stepIndex--;
            // Make sure stepIndex is valid in current step list
            const steps = this.getSteps();
            if (this.stepIndex >= steps.length) this.stepIndex = steps.length - 1;
            this.render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    },

    init() {
        this.stepIndex = 0;
        this.render();
    }
};

// ============================================================
// RENDERERS — one per step, builds the question HTML
// ============================================================
const renderers = {};
const savers = {};

// Helper: build multi-select checkboxes
function buildCheckboxes(container, name, options, anchoredBottom, saved, hasOther) {
    const randomizable = options.filter(o => !anchoredBottom.includes(o));
    const shuffled = shuffle(randomizable);
    const ordered = [...shuffled, ...anchoredBottom];
    if (hasOther) ordered.push('__other__');

    const wrap = document.createElement('div');
    wrap.className = 'space-y-2';

    ordered.forEach(opt => {
        if (opt === '__other__') {
            const lbl = document.createElement('label');
            lbl.className = 'option-label' + (saved && saved.some(s => s.startsWith('Other:')) ? ' selected' : '');
            const otherVal = saved ? (saved.find(s => s.startsWith('Other:')) || '').replace('Other: ', '') : '';
            lbl.innerHTML = `<input type="checkbox" name="${name}" value="__other__" ${otherVal ? 'checked' : ''}> Other:`;
            wrap.appendChild(lbl);
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'other-input';
            inp.placeholder = 'Please specify';
            inp.id = name + '_other_text';
            inp.value = otherVal;
            inp.disabled = !otherVal;
            wrap.appendChild(inp);
            lbl.querySelector('input').addEventListener('change', function() {
                inp.disabled = !this.checked;
                if (this.checked) inp.focus();
                lbl.classList.toggle('selected', this.checked);
            });
        } else {
            const lbl = document.createElement('label');
            const isChecked = saved && saved.includes(opt);
            lbl.className = 'option-label' + (isChecked ? ' selected' : '');
            lbl.innerHTML = `<input type="checkbox" name="${name}" value="${opt}" ${isChecked ? 'checked' : ''}> ${opt}`;
            wrap.appendChild(lbl);
            lbl.querySelector('input').addEventListener('change', function() {
                lbl.classList.toggle('selected', this.checked);
            });
        }
    });
    container.appendChild(wrap);
}

// Helper: build radio buttons
function buildRadios(container, name, options, saved, hasOther) {
    const wrap = document.createElement('div');
    wrap.className = 'space-y-2';
    options.forEach(opt => {
        const lbl = document.createElement('label');
        const isChecked = saved === opt;
        lbl.className = 'option-label' + (isChecked ? ' selected' : '');
        lbl.innerHTML = `<input type="radio" name="${name}" value="${opt}" ${isChecked ? 'checked' : ''}> ${opt}`;
        wrap.appendChild(lbl);
        lbl.querySelector('input').addEventListener('change', function() {
            wrap.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            lbl.classList.add('selected');
        });
    });
    if (hasOther) {
        const otherVal = saved && saved.startsWith('Other:') ? saved.replace('Other: ', '') : '';
        const lbl = document.createElement('label');
        lbl.className = 'option-label' + (otherVal ? ' selected' : '');
        lbl.innerHTML = `<input type="radio" name="${name}" value="__other__" ${otherVal ? 'checked' : ''}> Other:`;
        wrap.appendChild(lbl);
        const inp = document.createElement('input');
        inp.type = 'text'; inp.className = 'other-input'; inp.placeholder = 'Please specify';
        inp.id = name + '_other_text'; inp.value = otherVal; inp.disabled = !otherVal;
        wrap.appendChild(inp);
        lbl.querySelector('input').addEventListener('change', function() {
            wrap.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
            lbl.classList.add('selected');
            inp.disabled = false; inp.focus();
        });
        // Disable other input when another radio is selected
        wrap.querySelectorAll('input[type="radio"]').forEach(r => {
            if (r.value !== '__other__') {
                r.addEventListener('change', () => { inp.disabled = true; });
            }
        });
    }
    container.appendChild(wrap);
}

// Helper: read checkbox values
function readCheckboxes(name) {
    const vals = [];
    qsa(`input[name="${name}"]:checked`).forEach(cb => {
        if (cb.value === '__other__') {
            const txt = el(name + '_other_text');
            vals.push('Other: ' + (txt ? txt.value : ''));
        } else {
            vals.push(cb.value);
        }
    });
    return vals;
}

// Helper: read radio value
function readRadio(name) {
    const checked = qs(`input[name="${name}"]:checked`);
    if (!checked) return null;
    if (checked.value === '__other__') {
        const txt = el(name + '_other_text');
        return 'Other: ' + (txt ? txt.value : '');
    }
    return checked.value;
}

// -------------------------------------------------------
// Q1: Past Week Usage
// -------------------------------------------------------
renderers.q1 = function(area) {
    area.innerHTML = `<h2 class="text-lg font-bold mb-1">Q1. Past Week AI Usage</h2>
        <p class="text-gray-600 text-sm mb-4">Which of the following AI services have you used over the past 7 days? (Select all that apply)</p>
        <div id="q1-options"></div>`;
    const services = ['ChatGPT','Claude','Google Gemini','Microsoft Copilot/Microsoft 365 Copilot','Grok','Meta AI','Perplexity','Clarity AI'];
    const anchored = ['I have not used an AI service over the past 7 days'];
    buildCheckboxes(el('q1-options'), 'q1', services, anchored, survey.responses.q1, true);

    // Mutual exclusion: "I have not used" unchecks others and vice versa
    el('q1-options').addEventListener('change', function(e) {
        const cb = e.target;
        if (cb.type !== 'checkbox') return;
        if (cb.value === 'I have not used an AI service over the past 7 days' && cb.checked) {
            qsa('input[name="q1"]:checked').forEach(c => {
                if (c !== cb) { c.checked = false; c.closest('.option-label').classList.remove('selected'); }
            });
            const otherText = el('q1_other_text');
            if (otherText) { otherText.disabled = true; otherText.value = ''; }
        } else if (cb.value !== 'I have not used an AI service over the past 7 days' && cb.checked) {
            const notUsed = qs('input[name="q1"][value="I have not used an AI service over the past 7 days"]');
            if (notUsed) { notUsed.checked = false; notUsed.closest('.option-label').classList.remove('selected'); }
        }
    });
};
savers.q1 = function() {
    const vals = readCheckboxes('q1');
    if (vals.length === 0) { alert('Please select at least one option.'); return false; }
    survey.responses.q1 = vals;
    return true;
};

// -------------------------------------------------------
// Q2a-e: Validation questions
// -------------------------------------------------------
function makeQ2Renderer(stepId, serviceName, questionText, randomItems, anchoredItems) {
    renderers[stepId] = function(area) {
        area.innerHTML = `<h2 class="text-lg font-bold mb-1">${stepId.toUpperCase().replace('Q2','Q2')}. ${serviceName} Validation</h2>
            <p class="text-gray-600 text-sm mb-4">${questionText} (Select all that apply)</p>
            <div id="${stepId}-options"></div>`;
        buildCheckboxes(el(stepId + '-options'), stepId, randomItems, anchoredItems, survey.responses[stepId], true);
    };
    savers[stepId] = function() {
        const vals = readCheckboxes(stepId);
        if (vals.length === 0) { alert('Please select at least one option.'); return false; }
        survey.responses[stepId] = vals;
        return true;
    };
}

makeQ2Renderer('q2a', 'Google Gemini',
    'Which of the following ways did you access Google Gemini?',
    ['I went to gemini.google.com or used the Gemini app and typed a question into a chat',
     'I saw an AI-generated summary or answer at the top of regular Google Search results',
     'I used Gemini features built into another Google product (like Gmail or Google Docs)'],
    ["I'm not sure"]
);
makeQ2Renderer('q2b', 'Microsoft Copilot/Microsoft 365 Copilot',
    'Which of the following ways did you access Microsoft Copilot/Microsoft 365 Copilot?',
    ['I went to copilot.microsoft.com or used the Copilot app and typed a question into a chat',
     'I saw an AI-generated answer while searching on Bing or Edge',
     'I used Copilot features built into another Microsoft product (like Word, Excel, Teams)'],
    ["I'm not sure"]
);
makeQ2Renderer('q2c', 'Meta AI',
    'Which of the following ways did you access Meta AI?',
    ['I went to meta.ai or used the Meta AI app and typed a question into a chat',
     'I used the Meta AI feature built into WhatsApp, Instagram, Facebook, or Messenger',
     'I saw an AI-generated summary or answer while searching on Facebook or Instagram'],
    ["I'm not sure"]
);
makeQ2Renderer('q2d', 'Grok',
    'Which of the following ways did you access Grok?',
    ['I went to grok.com or used the Grok app and typed a question into a chat',
     'I used Grok within X (formerly Twitter) by interacting in a thread',
     'I used the chat interface in X to interact with Grok',
     'I saw AI-generated summaries or trending topic explanations on X that were powered by Grok'],
    ["I'm not sure"]
);
makeQ2Renderer('q2e', 'Perplexity',
    'Which of the following ways did you access Perplexity?',
    ['I went to perplexity.ai or used the Perplexity app and typed a question or search',
     'I used the Perplexity feature built into WhatsApp or Telegram',
     'I used Comet browser by Perplexity'],
    ["I'm not sure"]
);

// -------------------------------------------------------
// Q3: Subscriptions grid
// -------------------------------------------------------
renderers.q3 = function(area) {
    const services = ['ChatGPT','Claude','Google Gemini','Microsoft Copilot (incl. as part of Microsoft 365)','Grok','Perplexity','Character.AI','Clarity AI'];
    const cols = ['Yes, subscription I pay for','Yes, subscription my employer or school pays for',"I don't have this subscription","I'm not sure"];
    const colKeys = ['yes_self','yes_employer','no','not_sure'];
    const saved = survey.responses.q3 || {};

    let html = `<h2 class="text-lg font-bold mb-1">Q3. AI Subscriptions</h2>
        <p class="text-gray-600 text-sm mb-4">Do you have access to a paid subscription to any of the following AI services?</p>
        <div class="overflow-x-auto"><table class="grid-table">
        <thead><tr><th></th>`;
    cols.forEach(c => html += `<th>${c}</th>`);
    html += `</tr></thead><tbody>`;
    services.forEach(svc => {
        const key = svc;
        html += `<tr><td>${svc}</td>`;
        colKeys.forEach(ck => {
            const checked = saved[key] === ck ? 'checked' : '';
            html += `<td><input type="radio" name="q3_${CSS.escape(key)}" value="${ck}" ${checked}></td>`;
        });
        html += `</tr>`;
    });
    // Other row
    const otherKey = 'Other';
    html += `<tr><td>Other: <input type="text" id="q3_other_text" class="border border-gray-300 rounded px-2 py-1 text-sm w-32" placeholder="Specify" value="${(saved._otherName || '')}"></td>`;
    colKeys.forEach(ck => {
        const checked = saved[otherKey] === ck ? 'checked' : '';
        html += `<td><input type="radio" name="q3_Other" value="${ck}" ${checked}></td>`;
    });
    html += `</tr></tbody></table></div>`;
    area.innerHTML = html;
};
savers.q3 = function() {
    const services = ['ChatGPT','Claude','Google Gemini','Microsoft Copilot (incl. as part of Microsoft 365)','Grok','Perplexity','Character.AI','Clarity AI','Other'];
    const result = {};
    let answered = 0;
    services.forEach(svc => {
        const checked = qs(`input[name="q3_${CSS.escape(svc)}"]:checked`);
        if (checked) { result[svc] = checked.value; answered++; }
    });
    const otherText = el('q3_other_text');
    if (otherText && otherText.value) result._otherName = otherText.value;
    if (answered < 1) { alert('Please answer for at least one service.'); return false; }
    survey.responses.q3 = result;
    return true;
};

// -------------------------------------------------------
// Q4: Payment Frequency
// -------------------------------------------------------
renderers.q4 = function(area) {
    const subs = survey.getSubscribedServices();
    area.innerHTML = `<h2 class="text-lg font-bold mb-1">Q4. Payment Frequency</h2>
        <p class="text-gray-600 text-sm mb-4">Is your AI subscription billed monthly or annually?</p>
        <div id="q4-options"></div>`;
    buildRadios(el('q4-options'), 'q4', ['Monthly', 'Annually', "I'm not sure"], survey.responses.q4, true);
};
savers.q4 = function() {
    const val = readRadio('q4');
    if (!val) { alert('Please select an option.'); return false; }
    survey.responses.q4 = val;
    return true;
};

// -------------------------------------------------------
// Q5a: Cost per month
// -------------------------------------------------------
renderers.q5a = function(area) {
    const subs = survey.getSubscribedServices().join(', ') || 'your AI subscriptions';
    area.innerHTML = `<h2 class="text-lg font-bold mb-1">Q5. Monthly Cost</h2>
        <p class="text-gray-600 text-sm mb-4">You mentioned you pay <strong>monthly</strong>. How much do you pay each time for <strong>${subs}</strong>?</p>
        <div id="q5a-options"></div>`;
    buildRadios(el('q5a-options'), 'q5a', [
        "I don't pay anything / Covered by employer or school",
        'Up to $30','Between $30 and $99','Between $100 and $300','More than $300',"I'm not sure"
    ], survey.responses.q5a, false);
};
savers.q5a = function() {
    const val = readRadio('q5a');
    if (!val) { alert('Please select an option.'); return false; }
    survey.responses.q5a = val;
    return true;
};

// -------------------------------------------------------
// Q5b: Cost per year
// -------------------------------------------------------
renderers.q5b = function(area) {
    const subs = survey.getSubscribedServices().join(', ') || 'your AI subscriptions';
    area.innerHTML = `<h2 class="text-lg font-bold mb-1">Q5. Annual Cost</h2>
        <p class="text-gray-600 text-sm mb-4">You mentioned you pay <strong>annually</strong>. How much do you pay each time for <strong>${subs}</strong>?</p>
        <div id="q5b-options"></div>`;
    buildRadios(el('q5b-options'), 'q5b', [
        "I don't pay anything / Covered by employer or school",
        'Less than $100','Between $100 and $199','Between $200 and $299','Between $300 and $1000','More than $1000',"I'm not sure"
    ], survey.responses.q5b, false);
};
savers.q5b = function() {
    const val = readRadio('q5b');
    if (!val) { alert('Please select an option.'); return false; }
    survey.responses.q5b = val;
    return true;
};

// -------------------------------------------------------
// Q6: Subscription types
// -------------------------------------------------------
renderers.q6 = function(area) {
    const q3 = survey.responses.q3 || {};
    const subServices = Object.keys(q3).filter(k => k !== '_otherName' && (q3[k] === 'yes_self' || q3[k] === 'yes_employer'));

    const tierMap = {
        'ChatGPT': ['ChatGPT Plus', 'ChatGPT Pro', 'ChatGPT Go'],
        'Claude': ['Claude Pro', 'Claude Max 5x', 'Claude Max 20x'],
        'Google Gemini': ['Google AI Plus', 'Google AI Pro', 'Google AI Ultra'],
        'Grok': ['SuperGrok', 'SuperGrok Heavy'],
        'Perplexity': ['Perplexity Pro', 'Perplexity Max', 'Education Pro'],
        'Microsoft Copilot (incl. as part of Microsoft 365)': ['Microsoft 365 Premium', 'Microsoft 365 Personal']
    };

    let allTiers = [];
    subServices.forEach(svc => {
        if (tierMap[svc]) allTiers = allTiers.concat(tierMap[svc]);
    });

    ];

        <p class="text-gray-600 text-sm mb-4">Which of the following ways have you ever interacted with <strong>${svc}</strong>? (Select all that apply)</p>
        <div id="q12-options"></div>`;
    buildCheckboxes(el('q12-options'), 'q12', items, ['None of the above'], survey.responses.q12, false);

    // Mutual exclusion with "None of the above"
    el('q12-options').addEventListener('change', function(e) {
        const cb = e.target;
        if (cb.type !== 'checkbox') return;
        if (cb.value === 'None of the above' && cb.checked) {
            qsa('input[name="q12"]:checked').forEach(c => {
                if (c !== cb) { c.checked = false; c.closest('.option-label').classList.remove('selected'); }
            });
        } else if (cb.value !== 'None of the above' && cb.checked) {
            const none = qs('input[name="q12"][value="None of the above"]');
            if (none) { none.checked = false; none.closest('.option-label').classList.remove('selected'); }
        }
    });
};

renderers.results = function(area) {
    const r = survey.responses;
    let html = `<h2 class="text-xl font-bold mb-2 text-center">Survey Complete!</h2>
        <p class="text-gray-600 text-sm text-center mb-6">Thank you for completing the survey. You can download your responses below.</p>

            <button onclick="downloadJSON()" class="btn-primary">Download JSON</button>
            <button onclick="downloadCSV()" class="btn-secondary">Download CSV</button>
        </div>
        <h3 class="font-bold text-gray-700 mb-3">Response Summary</h3>
        <div class="space-y-3 text-sm" id="summary"></div>`;
    area.innerHTML = html;

    // Build summary
    const summary = el('summary');
    const addRow = (label, value) => {
        const d = document.createElement('div');
        d.className = 'border-b border-gray-100 pb-2';
        const val = Array.isArray(value) ? value.join(', ') : (typeof value === 'object' && value !== null ? JSON.stringify(value, null, 2) : (value || '—'));
        d.innerHTML = `<span class="font-medium text-gray-800">${label}:</span> <span class="text-gray-600">${typeof value === 'object' && !Array.isArray(value) ? '<pre class="text-xs mt-1 bg-gray-50 p-2 rounded overflow-x-auto">' + JSON.stringify(value, null, 2) + '</pre>' : (Array.isArray(value) ? value.join(', ') : (value || '—'))}</span>`;
        summary.appendChild(d);
    };

    addRow('Q1 - AI Services Used', r.q1);
    ['q2a','q2b','q2c','q2d','q2e'].forEach(k => { if (r[k]) addRow(`${k.toUpperCase()} - Validation`, r[k]); });
    if (r.q3) addRow('Q3 - Subscriptions', r.q3);
    if (r.q4) addRow('Q4 - Payment Frequency', r.q4);
    if (r.q5a) addRow('Q5 - Monthly Cost', r.q5a);
    if (r.q5b) addRow('Q5 - Annual Cost', r.q5b);
    if (r.q6) addRow('Q6 - Subscription Tiers', r.q6);
    addRow('Employment', r._emp_raw);
    if (r.q7) addRow('Q7 - Days Used', r.q7);
    if (r.q8) addRow('Q8 - Peak Intensity', r.q8);
    if (r.q9) addRow('Q9 - Work vs Personal', r.q9);
    if (r.q10) addRow('Q10 - Employer Payment', r.q10);
    if (r.q11) addRow('Q11 - Use Cases', r.q11);
    if (r.q12) addRow('Q12 - Interaction Types', r.q12);
    if (r.q13) addRow('Q13 - Task Automation', r.q13);
    if (r.q14) addRow('Q14 - Task Augmentation', r.q14);
    if (r.q15) addRow('Q15 - Usage Limits', r.q15);
};

// ============================================================
// DOWNLOAD FUNCTIONS
// ============================================================
function downloadJSON() {
    const data = JSON.stringify(survey.responses, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ai_survey_responses.json'; a.click();
    URL.revokeObjectURL(url);
}

function downloadCSV() {
    const r = survey.responses;
    const rows = [['Question', 'Response']];

    const addCSVRow = (q, val) => {
        if (Array.isArray(val)) rows.push([q, val.join('; ')]);
        else if (typeof val === 'object' && val !== null) {
            Object.entries(val).forEach(([k, v]) => {
                if (k !== '_otherName') rows.push([`${q} - ${k}`, v]);
            });
        }
        else if (val) rows.push([q, val]);
    };

    addCSVRow('Q1 - AI Services Used', r.q1);
    ['q2a','q2b','q2c','q2d','q2e'].forEach(k => { if (r[k]) addCSVRow(`${k.toUpperCase()} - Validation`, r[k]); });
    if (r.q3) addCSVRow('Q3 - Subscriptions', r.q3);
    if (r.q4) addCSVRow('Q4 - Payment Frequency', r.q4);
    if (r.q5a) addCSVRow('Q5 - Monthly Cost', r.q5a);
    if (r.q5b) addCSVRow('Q5 - Annual Cost', r.q5b);
    if (r.q6) addCSVRow('Q6 - Subscription Tiers', r.q6);
    addCSVRow('Employment', r._emp_raw);
    if (r.q7) addCSVRow('Q7 - Days Used', r.q7);
    if (r.q8) addCSVRow('Q8 - Peak Intensity', r.q8);
    if (r.q9) addCSVRow('Q9 - Work vs Personal', r.q9);
    if (r.q10) addCSVRow('Q10 - Employer Payment', r.q10);
    if (r.q11) addCSVRow('Q11 - Use Cases', r.q11);
    if (r.q12) addCSVRow('Q12 - Interaction Types', r.q12);
    if (r.q13) addCSVRow('Q13 - Task Automation', r.q13);
    if (r.q14) addCSVRow('Q14 - Task Augmentation', r.q14);
    if (r.q15) addCSVRow('Q15 - Usage Limits', r.q15);

    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ai_survey_responses.csv'; a.click();
    URL.revokeObjectURL(url);
}
